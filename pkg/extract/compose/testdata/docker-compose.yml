name: acme-shop
services:
  proxy:
    image: nginx:latest
    ports:
      - "80:80"
      - "443:443"
    depends_on: [app]
  app:
    build: .
    environment:
      DATABASE_URL: postgres://app:s3cret@db:5432/app?sslmode=disable
      REDIS_URL: redis://cache:6379/0
      JWT_SECRET: ${JWT_SECRET}
  db:
    image: postgres:16.4
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_PASSWORD=supersecret
  cache:
    image: redis:7.4
    ports:
      - "127.0.0.1:6379:6379"
  worker:
    image: acme/worker
    privileged: true
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      API_TOKEN_FILE: /run/secrets/api_token
