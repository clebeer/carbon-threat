name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-client:
    name: Lint ct.client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ct.client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ct.client/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm run lint

  test-client:
    name: Test ct.client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ct.client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ct.client/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm test

  build-client:
    name: Build ct.client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ct.client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ct.client/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm run build

  test-server:
    name: Test td.server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: td.server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: td.server/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm test

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Audit ct.client
        run: cd ct.client && npm audit --audit-level=high || true
      - name: Audit td.server
        run: cd td.server && npm audit --audit-level=high || true

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: [lint-client, test-client, build-client, test-server]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t carbon-threat:ci-check .
      - name: Verify container starts
        run: |
          docker run -d --name ct-test -p 3001:3001 \
            -e JWT_SECRET=test-secret \
            -e NODE_ENV=production \
            carbon-threat:ci-check
          sleep 8
          HEALTH_STATUS=$(curl -sf http://localhost:3001/healthz 2>/dev/null || echo "FAILED")
          echo "Health check response: $HEALTH_STATUS"
          docker logs ct-test
          docker stop ct-test
          if [ "$HEALTH_STATUS" = "FAILED" ]; then
            echo "::warning::Container health check failed (may need DB connection)"
          fi