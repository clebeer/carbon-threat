name: Bug report
description: Something in Carbon Threat does not work as expected.
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        **Security problems must not be reported here** — use the private link in SECURITY.md.
        The v1 web platform (`legacy/v1-final`) is unsupported; bugs against it will be closed.
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Output of `ctm version`, or the commit SHA you built from.
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Include the exact command you ran and its output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: The smallest model, IaC snippet, or repository that shows the problem. Remove secrets and private data.
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "macOS 15 / arm64, installed via Homebrew"
